name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate project files
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'build.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -ne 0) {
            throw ($parseErrors | Out-String)
          }

          $infText = Get-Content -Raw -LiteralPath (Join-Path $PWD 'driver\lg-38wn95c-arm64.inf')
          $requiredInfContent = @(
            '[Version]'
            'Signature="$WINDOWS NT$"'
            'Class=Monitor'
            'CatalogFile=lg-38wn95c-arm64.cat'
            '[SourceDisksNames.arm64]'
            '[SourceDisksFiles.arm64]'
            '%ProviderName%=LGModels,NTarm64'
            '[LGModels.NTarm64]'
            'MONITOR\GSM774C'
            'MONITOR\GSM774D'
            'MONITOR\GSM774E'
            'MaxResolution,,"3840,1600"'
            '30.0-125.0,48.0-75.0'
            '30.0-250.0,48.0-144.0'
            'PreferredMode,,"3840,1600,75"'
            'PreferredMode,,"3840,1600,120"'
            'ICMProfile,0,"LG HDR WQHD+.icm"'
            'AddService=,2'
          )

          $missingInfContent = @($requiredInfContent | Where-Object { -not $infText.Contains($_) })
          if ($missingInfContent.Count -ne 0) {
            throw "Required INF content is missing: $($missingInfContent -join ', ')"
          }

          $trackedFiles = git ls-files
          $forbiddenTrackedFiles = @($trackedFiles | Where-Object {
            $_ -match '(^|/)(out/|.*\.(cat|exe|icm|zip)$|LG HDR WQHD+\.inf$)'
          })
          if ($forbiddenTrackedFiles.Count -ne 0) {
            throw "LG-owned or generated files must not be tracked: $($forbiddenTrackedFiles -join ', ')"
          }
